name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc.1, published as a pre-release) to build
# the Windows installer and portable zip and attach them to a DRAFT GitHub
# Release. Review the draft and its size summary, then publish it by hand.
# See docs/BUILD.md. Tag commits that already passed ci.yml.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  verify:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Compare tag with Cargo.toml / tauri.conf.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "glint") | .version')"
          conf_version=""
          if [ -f src-tauri/tauri.conf.json ]; then
            conf_version="$(jq -r '.version // empty' src-tauri/tauri.conf.json)"
          fi
          echo "tag: $want, Cargo.toml: $cargo_version, tauri.conf.json: ${conf_version:-<unset>}"
          [ "$cargo_version" = "$want" ] || { echo "::error::Cargo.toml version $cargo_version does not match tag $GITHUB_REF_NAME"; exit 1; }
          if [ -n "$conf_version" ] && [ "$conf_version" != "$want" ]; then
            echo "::error::tauri.conf.json version $conf_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/windows-build.yml
    permissions:
      contents: read
    with:
      retention-days: 30
    # secrets: inherit # once code signing is enabled (see windows-build.yml)

  draft-release:
    name: Draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Re-runs add to the existing draft instead of creating a second one.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            flags=(--draft --verify-tag --title "Glint $TAG" --generate-notes)
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" ./*
          fi
