[package]
name = "glint-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `ort-dynamic` (default) loads `onnxruntime.dll` / `libonnxruntime.so` at run time, from
# `PaddleOptions::ort_dylib_path`, then `ORT_DYLIB_PATH`, then next to the executable. It needs
# no download at build time. The shipped runtime must be ONNX Runtime >= 1.31.
# `ort-static` (opt-in) uses `ort`'s `download-binaries` to link a prebuilt runtime into the
# executable. On Windows that prebuilt is the DirectML flavour (there is no CPU-only one), so
# prefer `ort-dynamic` there. Do not enable both.
# With neither feature, `PaddleOcr::load` returns `OcrError::Unsupported`.
default = ["ort-dynamic"]
ort-dynamic = ["dep:ort", "ort/load-dynamic"]
ort-static = ["dep:ort", "ort/download-binaries", "ort/tls-native"]

[dependencies]
image.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
# Script-restricted language guess for Latin text (see `postprocess::detect_lang`).
whatlang = { version = "0.16", default-features = false }
# ONNX Runtime binding. oar-ocr was rejected: it pins `ort =2.0.0-rc.13` and drags in
# tokenizers/onig, imageproc, nalgebra, ndarray and every `image` codec (see the report).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    # apartment init for the worker thread, and the working-set trim in `trim_process_memory`
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
