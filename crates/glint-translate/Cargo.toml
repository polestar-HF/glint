[package]
name = "glint-translate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
async-trait = "0.1"
# Request signing for Baidu (md5) and Youdao (sha256), and the cache's text digest.
# Both are tiny RustCrypto crates (sha2 is already in the lockfile through other dependencies).
md-5 = "0.10"
sha2 = "0.10"

[dev-dependencies]
# The integration tests run a tiny HTTP mock on a tokio TcpListener; test-util gives a paused clock.
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }
