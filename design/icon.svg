<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Glint app icon — 1024 master. Dark squircle, floating white capture brackets, 4-facet cyan crystal. -->
  <defs>
    <!-- Dark charcoal vertical gradient -->
    <linearGradient id="tileBg" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35363B"/>
      <stop offset=".5" stop-color="#28292D"/>
      <stop offset="1" stop-color="#191A1E"/>
    </linearGradient>

    <!-- 3D pill shading (soft underside bevel) + floating drop shadow for the white brackets -->
    <filter id="bracket3d" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <!-- Floating drop shadow -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="15" result="shadowOff"/>
      <feFlood flood-color="#000000" flood-opacity=".68" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOff" operator="in" result="dropShadow"/>

      <!-- Soft underside inner bevel (top-lit pillow feel) -->
      <feOffset in="SourceAlpha" dx="0" dy="-8" result="upAlpha"/>
      <feGaussianBlur in="upAlpha" stdDeviation="6.5" result="upBlur"/>
      <feComposite in="SourceAlpha" in2="upBlur" operator="out" result="innerMask"/>
      <feFlood flood-color="#969AA2" flood-opacity=".56" result="bevelColor"/>
      <feComposite in="bevelColor" in2="innerMask" operator="in" result="innerShade"/>
      <feComposite in="innerShade" in2="SourceGraphic" operator="over" result="pill"/>

      <feMerge>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="pill"/>
      </feMerge>
    </filter>

    <!-- 4-facet luminous cyan crystal gradients -->
    <linearGradient id="facetTL" x1="512" y1="317" x2="430" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E4FEFA"/>
      <stop offset="1" stop-color="#C5FDF6"/>
    </linearGradient>

    <linearGradient id="facetTR" x1="512" y1="317" x2="700" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFD6DD"/>
      <stop offset=".38" stop-color="#8AE6FF"/>
      <stop offset=".76" stop-color="#C6F3FF"/>
      <stop offset="1" stop-color="#F2FCFF"/>
    </linearGradient>

    <linearGradient id="facetBL" x1="317" y1="512" x2="512" y2="707" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset=".48" stop-color="#C6F3FF"/>
      <stop offset="1" stop-color="#95E7FF"/>
    </linearGradient>

    <linearGradient id="facetBR" x1="580" y1="512" x2="512" y2="707" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1EAAD4"/>
      <stop offset=".52" stop-color="#49B8E4"/>
      <stop offset="1" stop-color="#75C5F2"/>
    </linearGradient>
  </defs>

  <!-- Continuous squircle tile (896x896 centered in 1024x1024) -->
  <path d="M 324 64 H 700 C 866 64 960 158 960 324 V 700 C 960 866 866 960 700 960 H 324 C 158 960 64 866 64 700 V 324 C 64 158 158 64 324 64 Z" fill="url(#tileBg)"/>

  <!-- Floating white rounded capture brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" filter="url(#bracket3d)">
    <path d="M 234 362 V 278 A 44 44 0 0 1 278 234 H 362"/>
    <path d="M 662 234 H 746 A 44 44 0 0 1 790 278 V 362"/>
    <path d="M 234 662 V 746 A 44 44 0 0 0 278 790 H 362"/>
    <path d="M 662 790 H 746 A 44 44 0 0 0 790 746 V 662"/>
  </g>

  <!-- Centered 4-facet luminous cyan crystal -->
  <g>
    <path d="M 512 318 L 706 512 L 512 706 L 318 512 Z" fill="#8CE6FF"/>
    <path d="M 512 317 L 512 512 L 317 512 Z" fill="url(#facetTL)"/>
    <path d="M 512 317 L 707 512 L 512 512 Z" fill="url(#facetTR)"/>
    <path d="M 317 512 L 512 512 L 512 707 Z" fill="url(#facetBL)"/>
    <path d="M 512 512 L 707 512 L 512 707 Z" fill="url(#facetBR)"/>
  </g>
</svg>
