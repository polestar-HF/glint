<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Glint app icon — 16 px, hand-tuned on the pixel grid for taskbar/tray clarity. -->
  <path d="M 4.6 0 H 11.4 C 14.3 0 16 1.7 16 4.6 V 11.4 C 16 14.3 14.3 16 11.4 16 H 4.6 C 1.7 16 0 14.3 0 11.4 V 4.6 C 0 1.7 1.7 0 4.6 0 Z" fill="#232428" shape-rendering="geometricPrecision"/>

  <!-- White capture frame, 1 px on the pixel grid with softened outer corner -->
  <g fill="#F8F9FA">
    <rect x="3" y="2" width="3" height="1"/><rect x="2" y="3" width="1" height="3"/>
    <rect x="10" y="2" width="3" height="1"/><rect x="13" y="3" width="1" height="3"/>
    <rect x="3" y="13" width="3" height="1"/><rect x="2" y="10" width="1" height="3"/>
    <rect x="10" y="13" width="3" height="1"/><rect x="13" y="10" width="1" height="3"/>
  </g>
  <g fill="#C8CCD2">
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="13" y="2" width="1" height="1"/>
    <rect x="2" y="13" width="1" height="1"/>
    <rect x="13" y="13" width="1" height="1"/>
  </g>

  <!-- 4-facet cyan crystal: 8 px stepped diamond -->
  <rect x="7" y="4" width="1" height="1" fill="#FFFFFF"/><rect x="8" y="4" width="1" height="1" fill="#A8E8FA"/>
  <rect x="6" y="5" width="2" height="1" fill="#ECFFFD"/><rect x="8" y="5" width="2" height="1" fill="#8EE6FF"/>
  <rect x="5" y="6" width="3" height="1" fill="#D8FEF9"/><rect x="8" y="6" width="3" height="1" fill="#9EEBFF"/>
  <rect x="4" y="7" width="4" height="1" fill="#C6FDF6"/><rect x="8" y="7" width="4" height="1" fill="#CFF5FF"/>
  <rect x="4" y="8" width="4" height="1" fill="#E8FAFF"/><rect x="8" y="8" width="4" height="1" fill="#25B0DB"/>
  <rect x="5" y="9" width="3" height="1" fill="#CDF5FF"/><rect x="8" y="9" width="3" height="1" fill="#37B6E0"/>
  <rect x="6" y="10" width="2" height="1" fill="#B2EEFF"/><rect x="8" y="10" width="2" height="1" fill="#4DBBE6"/>
  <rect x="7" y="11" width="1" height="1" fill="#98E8FF"/><rect x="8" y="11" width="1" height="1" fill="#6EC2F0"/>
</svg>
