<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Glint · Glass pane · 32 px. One gradient (the recognized light), no grain, whole pixels. -->
  <defs>
    <linearGradient id="light" x1="10" y1="0" x2="17" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E6AC5"/>
      <stop offset="0.65" stop-color="#3A97E6"/>
      <stop offset="1" stop-color="#9ADBF3"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#1E1F22" shape-rendering="geometricPrecision"/>
  <!-- Hairline edge: keeps the tile apart from a dark taskbar or Explorer. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.11" shape-rendering="geometricPrecision"/>
  <!-- The page runs past the glass. -->
  <g fill="#34363B">
    <rect x="3" y="12" width="3" height="2"/><rect x="26" y="12" width="3" height="2"/>
    <rect x="3" y="16" width="3" height="2"/><rect x="26" y="16" width="3" height="2"/>
  </g>
  <!-- Glass: a little lighter than the tile, a lit top row. -->
  <rect x="6" y="6" width="20" height="20" rx="4" fill="#2D2F34" shape-rendering="geometricPrecision"/>
  <rect x="10" y="6" width="12" height="1" fill="#44474D"/>
  <!-- Seen through the glass (shifted down a pixel: refraction). -->
  <rect x="9" y="13" width="14" height="2" fill="#62666E"/>
  <rect x="9" y="17" width="14" height="2" fill="#4F5359"/>
  <rect x="10" y="17" width="7" height="2" fill="url(#light)"/>
  <rect x="9" y="21" width="10" height="2" fill="#4A4D53"/>
  <!-- Lit corners: the capture brackets. -->
  <path fill="#FFFFFF" d="M6 6h5v2H8v3H6z"/>
  <path fill="#E8E8E6" d="M21 6h5v5h-2V8h-3zM6 21h2v3h3v2H6z"/>
  <path fill="#CDCED1" d="M24 21h2v5h-5v-2h3z"/>
</svg>
