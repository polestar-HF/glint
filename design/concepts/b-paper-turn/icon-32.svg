<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Paper turn — 32 px, hand-tuned. One gradient (the iridescent underside), no grain. Fold: x + y = 46. -->
  <defs>
    <clipPath id="t"><rect width="32" height="32" rx="7"/></clipPath>
    <linearGradient id="iris" x1="32" y1="14" x2="14" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE6F6"/><stop offset=".5" stop-color="#F8F9FA"/><stop offset="1" stop-color="#F6D3BE"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#t)">
    <rect width="32" height="32" fill="#F4F2ED"/>
    <path d="M32 14V32H14Z" fill="#1E6AC5" shape-rendering="geometricPrecision"/>
    <g fill="#26282C">
      <rect x="6" y="6" width="6" height="2"/><rect x="6" y="8" width="2" height="4"/>
      <rect x="20" y="6" width="6" height="2"/><rect x="24" y="8" width="2" height="4"/>
      <rect x="6" y="24" width="6" height="2"/><rect x="6" y="20" width="2" height="4"/>
    </g>
    <rect x="10" y="11" width="12" height="2" fill="#26282C"/>
    <rect x="10" y="14" width="10" height="2" fill="#A3A19D"/>
    <rect x="10" y="17" width="6" height="2" fill="#A3A19D"/>
    <path d="M32 14 L18.5 18.5 L14 32Z" fill="#B9C3CF" shape-rendering="geometricPrecision"/>
    <path d="M32 14 L19.7 18.9 L18.9 19.7 L14 32 L18.5 18.5Z" fill="url(#iris)" shape-rendering="geometricPrecision"/>
  </g>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="#000" stroke-opacity=".14" shape-rendering="geometricPrecision"/>
</svg>
