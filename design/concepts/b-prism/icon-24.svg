<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Glint / prism — 24 px, hand-tuned. Flat fills; no grain, no gradient. -->
  <rect width="24" height="24" rx="5" fill="#202124" shape-rendering="geometricPrecision"/>
  <g fill="#E6E5E1">
    <rect x="4" y="4" width="5" height="2"/><rect x="4" y="6" width="2" height="3"/>
    <rect x="15" y="4" width="5" height="2"/><rect x="18" y="6" width="2" height="3"/>
    <rect x="4" y="18" width="5" height="2"/><rect x="4" y="15" width="2" height="3"/>
    <rect x="15" y="18" width="5" height="2"/><rect x="18" y="15" width="2" height="3"/>
  </g>
  <!-- line in (matte) and out (ink light) -->
  <rect x="5" y="11" width="4" height="2" fill="#CFCECA"/>
  <rect x="15" y="11" width="4" height="2" fill="#4A93E8"/>
  <!-- crystal: 10 px diamond, four facets -->
  <g shape-rendering="geometricPrecision">
    <path d="M12 7 L11.6 11.6 L7 12Z" fill="#FFFFFF"/>
    <path d="M12 7 L17 12 L11.6 11.6Z" fill="#C7D0DB"/>
    <path d="M7 12 L11.6 11.6 L12 17Z" fill="#949AA2"/>
    <path d="M17 12 L12 17 L11.6 11.6Z" fill="#2671CF"/>
  </g>
</svg>
