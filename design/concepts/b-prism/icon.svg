<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Glint / prism — 1024 master. One light source, top left. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E3034"/>
      <stop offset="1" stop-color="#18191C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="280" cy="160" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="64" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <filter id="grain" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/>
      <feBlend in="g" in2="SourceGraphic" mode="soft-light" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="arithmetic" k2=".2" k3=".8" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>

    <linearGradient id="satin" x1="0" y1="236" x2="0" y2="788" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F7F4"/>
      <stop offset="1" stop-color="#C6C5C1"/>
    </linearGradient>

    <!-- crystal: neutral glass, value does the modelling -->
    <linearGradient id="fTL" x1="400" y1="400" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F2F5"/>
    </linearGradient>
    <linearGradient id="fTR" x1="512" y1="360" x2="660" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDF0F4"/>
      <stop offset=".6" stop-color="#C3CBD5"/>
      <stop offset="1" stop-color="#9AA5B2"/>
    </linearGradient>
    <linearGradient id="fBL" x1="360" y1="512" x2="512" y2="664" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8BDC4"/>
      <stop offset="1" stop-color="#6E747C"/>
    </linearGradient>
    <linearGradient id="fBR" x1="500" y1="500" x2="620" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E7FDB"/>
      <stop offset=".5" stop-color="#1E6AC5"/>
      <stop offset="1" stop-color="#0D3670"/>
    </linearGradient>
    <!-- dispersion bands (thin, inside the glass) -->
    <linearGradient id="bandTR" x1="560" y1="440" x2="600" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8E9F7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A8E9F7" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6AAEF2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandBL" x1="430" y1="560" x2="470" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9BF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFC9A6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFE9D9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandBR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FE3F6" stop-opacity="0"/>
      <stop offset=".45" stop-color="#9FE3F6" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#5E9FF0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#1E6AC5" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="lowerClip"><path d="M352 512 L494 494 L672 512 L512 672Z"/></clipPath>
    <clipPath id="crystalClip"><path d="M512 352 L672 512 L512 672 L352 512Z"/></clipPath>
    <linearGradient id="fan" x1="0" y1="440" x2="0" y2="592" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FE0F5" stop-opacity="0"/>
      <stop offset=".28" stop-color="#8FE0F5"/>
      <stop offset=".5" stop-color="#5FA6F2"/>
      <stop offset=".72" stop-color="#FFC4A0"/>
      <stop offset="1" stop-color="#FFC4A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fanFadeG" x1="352" y1="0" x2="672" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="fanFade" maskUnits="userSpaceOnUse" x="300" y="380" width="460" height="260"><rect x="300" y="380" width="460" height="260" fill="url(#fanFadeG)"/></mask>
    <filter id="fanSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <!-- translated line = light -->
    <linearGradient id="beam" x1="640" y1="0" x2="736" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DB8F6"/>
      <stop offset="1" stop-color="#2F7BD6"/>
    </linearGradient>

    <filter id="bloom" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloomWide" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="refr" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="flareBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="hair" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)" filter="url(#grain)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>

  <g clip-path="url(#tileClip)">
    <!-- light leaving the crystal along the line -->
    <rect x="600" y="472" width="200" height="80" rx="40" fill="#2F7BD6" opacity=".55" filter="url(#bloomWide)"/>
    <rect x="620" y="490" width="140" height="44" rx="22" fill="#4A93E8" opacity=".55" filter="url(#bloom)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>

  <!-- capture frame -->
  <g fill="none" stroke="url(#satin)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 368V256H368"/>
    <path d="M656 256H768V368"/>
    <path d="M768 656V768H656"/>
    <path d="M368 768H256V656"/>
  </g>

  <!-- source line (matte) -->
  <rect x="292" y="492" width="120" height="40" rx="20" fill="#E9E8E4"/>
  <!-- translated line: it is light now -->
  <rect x="610" y="492" width="122" height="40" rx="20" fill="url(#beam)"/>

  <!-- crystal -->
  <g transform="translate(512 512) scale(1.08) translate(-512 -512)">
  <path d="M512 356 L668 512 L512 668 L356 512Z" fill="#000" opacity=".5" filter="url(#shadow)" transform="translate(8 16)"/>
  <path d="M512 352 L494 494 L352 512Z" fill="url(#fTL)"/>
  <path d="M512 352 L672 512 L494 494Z" fill="url(#fTR)"/>
  <path d="M352 512 L494 494 L512 672Z" fill="url(#fBL)"/>
  <path d="M672 512 L512 672 L494 494Z" fill="url(#fBR)"/>
  <!-- seen through the glass: the line, refracted down and shifted -->
  <g clip-path="url(#lowerClip)">
    <g filter="url(#refr)">
      <rect x="300" y="516" width="196" height="30" rx="15" fill="#FFFFFF" opacity=".34"/>
      <rect x="522" y="518" width="170" height="26" rx="13" fill="#A6D2FB" opacity=".5"/>
    </g>
  </g>
  <!-- dispersion: the line's light fans out inside the glass -->
  <g clip-path="url(#crystalClip)">
    <path d="M352 512 L700 418 L700 612 Z" fill="url(#fan)" mask="url(#fanFade)" filter="url(#fanSoft)" opacity=".7"/>
  </g>
  <g clip-path="url(#crystalClip)" style="mix-blend-mode:screen">
    <path d="M352 512 L700 430 L700 600 Z" fill="url(#fan)" mask="url(#fanFade)" filter="url(#fanSoft)" opacity=".6"/>
  </g>
  <!-- ridges and girdle -->
  <g fill="none" stroke-linecap="round">
    <path d="M512 352 L494 494 L352 512" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M494 494 L672 512" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2"/>
    <path d="M494 494 L512 672" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    <path d="M512 352 L672 512 L512 672 L352 512Z" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round"/>
  </g>

  </g>
  <!-- the glint: a specular catch on the apex, anamorphic -->
  <g transform="translate(512 340)" style="mix-blend-mode:screen">
    <ellipse rx="34" ry="18" fill="#FFFFFF" opacity=".5" filter="url(#flareBlur)"/>
    <path d="M-150 0 Q0 -3.5 150 0 Q0 3.5 -150 0Z" fill="#FFFFFF"/>
    <path d="M0 -44 Q2.5 0 0 44 Q-2.5 0 0 -44Z" fill="#FFFFFF" opacity=".85"/>
    <circle r="7" fill="#FFFFFF"/>
  </g>
</svg>
