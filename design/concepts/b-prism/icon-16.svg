<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Glint / prism — 16 px, hand-tuned. Flat fills on the pixel grid; no grain, no gradient. -->
  <rect width="16" height="16" rx="3" fill="#202124" shape-rendering="geometricPrecision"/>
  <!-- capture frame, 1 px -->
  <g fill="#E6E5E1">
    <rect x="2" y="2" width="4" height="1"/><rect x="2" y="3" width="1" height="3"/>
    <rect x="10" y="2" width="4" height="1"/><rect x="13" y="3" width="1" height="3"/>
    <rect x="2" y="13" width="4" height="1"/><rect x="2" y="10" width="1" height="3"/>
    <rect x="10" y="13" width="4" height="1"/><rect x="13" y="10" width="1" height="3"/>
  </g>
  <!-- crystal: 8 px stepped diamond; lit / cool / shade / ink quadrants -->
  <rect x="7" y="4" width="1" height="1" fill="#FFFFFF"/><rect x="8" y="4" width="1" height="1" fill="#DCE2E9"/>
  <rect x="6" y="5" width="2" height="1" fill="#FFFFFF"/><rect x="8" y="5" width="2" height="1" fill="#D3DAE2"/>
  <rect x="5" y="6" width="3" height="1" fill="#FFFFFF"/><rect x="8" y="6" width="3" height="1" fill="#C9D1DB"/>
  <rect x="4" y="7" width="4" height="1" fill="#F3F4F6"/><rect x="8" y="7" width="4" height="1" fill="#BCC6D2"/>
  <rect x="4" y="8" width="4" height="1" fill="#A3A9B1"/><rect x="8" y="8" width="4" height="1" fill="#3482DC"/>
  <rect x="5" y="9" width="3" height="1" fill="#959BA3"/><rect x="8" y="9" width="3" height="1" fill="#2B76D1"/>
  <rect x="6" y="10" width="2" height="1" fill="#878D95"/><rect x="8" y="10" width="2" height="1" fill="#246BC3"/>
  <rect x="7" y="11" width="1" height="1" fill="#7A8088"/><rect x="8" y="11" width="1" height="1" fill="#1F62B5"/>
</svg>
