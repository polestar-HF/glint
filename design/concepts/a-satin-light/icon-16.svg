  <path fill="#F4F4F2" d="M3 3h4v2H5v2H3zM9 3h4v4h-2V5H9zM3 9h2v2h2v2H3zM11 9h2v4H9v-2h2z"/>
  <rect x="6" y="7" width="4" height="2" fill="url(#light)"/>
</svg>
