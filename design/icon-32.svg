<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Glint app icon — 32 px, hand-tuned. -->
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35363B"/>
      <stop offset="1" stop-color="#191A1E"/>
    </linearGradient>
    <linearGradient id="facetTL" x1="16" y1="9" x2="13" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5FDF6"/>
    </linearGradient>
    <linearGradient id="facetTR" x1="16" y1="9" x2="23" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BBD5DD"/>
      <stop offset=".42" stop-color="#8AE6FF"/>
      <stop offset="1" stop-color="#F0FCFF"/>
    </linearGradient>
    <linearGradient id="facetBL" x1="9" y1="16" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset="1" stop-color="#96E8FF"/>
    </linearGradient>
    <linearGradient id="facetBR" x1="18" y1="16" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1FAAD5"/>
      <stop offset="1" stop-color="#72C3F0"/>
