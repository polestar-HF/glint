  <defs>
    <linearGradient id="ink" x1="16" y1="16" x2="19" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A86E0"/><stop offset="1" stop-color="#1A5DB0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#202124" shape-rendering="geometricPrecision"/>
  <g fill="#E6E5E1">
    <rect x="6" y="6" width="6" height="2"/><rect x="6" y="8" width="2" height="4"/>
    <rect x="20" y="6" width="6" height="2"/><rect x="24" y="8" width="2" height="4"/>
    <rect x="6" y="24" width="6" height="2"/><rect x="6" y="20" width="2" height="4"/>
    <rect x="20" y="24" width="6" height="2"/><rect x="24" y="20" width="2" height="4"/>
  </g>
  <rect x="8" y="15" width="4" height="2" fill="#CFCECA"/>
  <rect x="20" y="15" width="5" height="2" fill="#4A93E8"/>
  <g shape-rendering="geometricPrecision">
    <path d="M16 9 L15.5 15.5 L9 16Z" fill="#FFFFFF"/>
    <path d="M16 9 L23 16 L15.5 15.5Z" fill="#C7D0DB"/>
    <path d="M9 16 L15.5 15.5 L16 23Z" fill="#949AA2"/>
