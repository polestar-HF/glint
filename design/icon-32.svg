  <path d="M 9.3 0 H 22.7 C 28.6 0 32 3.4 32 9.3 V 22.7 C 32 28.6 28.6 32 22.7 32 H 9.3 C 3.4 32 0 28.6 0 22.7 V 9.3 C 0 3.4 3.4 0 9.3 0 Z" fill="url(#tileBg)"/>

  <!-- Subtle shadow under brackets -->
  <g fill="none" stroke="#000000" stroke-opacity=".42" stroke-width="2.3" stroke-linecap="round" transform="translate(0 0.7)">
    <path d="M 6.1 10.8 V 7.7 A 1.6 1.6 0 0 1 7.7 6.1 H 10.8"/>
    <path d="M 21.2 6.1 H 24.3 A 1.6 1.6 0 0 1 25.9 7.7 V 10.8"/>
    <path d="M 6.1 21.2 V 24.3 A 1.6 1.6 0 0 0 7.7 25.9 H 10.8"/>
    <path d="M 21.2 25.9 H 24.3 A 1.6 1.6 0 0 0 25.9 24.3 V 21.2"/>
  </g>

  <!-- Crisp white rounded capture brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
    <path d="M 6.1 10.8 V 7.7 A 1.6 1.6 0 0 1 7.7 6.1 H 10.8"/>
    <path d="M 21.2 6.1 H 24.3 A 1.6 1.6 0 0 1 25.9 7.7 V 10.8"/>
