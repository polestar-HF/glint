    <path d="M 21.2 25.9 H 24.3 A 1.6 1.6 0 0 0 25.9 24.3 V 21.2"/>
  </g>

  <!-- 4-facet cyan crystal -->
  <path d="M 16 9.3 L 22.7 16 L 16 22.7 L 9.3 16 Z" fill="#8CE6FF"/>
  <path d="M 16 9 L 16 16 L 9 16 Z" fill="url(#facetTL)"/>
  <path d="M 16 9 L 23 16 L 16 16 Z" fill="url(#facetTR)"/>
  <path d="M 9 16 L 16 16 L 16 23 Z" fill="url(#facetBL)"/>
  <path d="M 16 16 L 23 16 L 16 23 Z" fill="url(#facetBR)"/>
